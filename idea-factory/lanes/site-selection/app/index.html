<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Site Check</title>
<meta name="description" content="Where Michigan has room for one more shop: residents per existing shop, plus ZIP demographics">
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="assets/factory.css">
<link rel="stylesheet" href="assets/leaflet.css">
<style>
:root{--acc:#2f6b4f;--acc-fg:#fff;--hot:#b5710f;--bg:#f1f4f2;--line:#d3dcd7;--card:#fff;--card2:#e6ede9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#7fcba5;--acc-fg:#08130d;--hot:#f0b053;--bg:#0f1512;--line:#25302a;--card:#161e1a;--card2:#1d2822}}
:root[data-theme="dark"]{--acc:#7fcba5;--acc-fg:#08130d;--hot:#f0b053;--bg:#0f1512;--line:#25302a;--card:#161e1a;--card2:#1d2822}
body{font-size:15px}
.page{gap:14px;padding-top:14px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi b{font-size:24px}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
#map{height:300px;border-radius:10px;border:1px solid var(--line)}
.leaflet-container{font:inherit;background:var(--card2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar select,.toolbar input{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;min-width:0;flex:1 1 150px}
.bars{display:flex;flex-direction:column;gap:7px}
.bars .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px;cursor:pointer}
.bars .r i{grid-column:1/3;display:block;height:6px;border-radius:3px;background:var(--acc)}
.rep{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.rep div{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
.rep b{display:block;font-size:19px;font-variant-numeric:tabular-nums}.rep small{color:var(--mute)}
.verdict{padding:10px 12px;border-left:3px solid var(--acc);background:var(--card2);border-radius:8px;font-size:14px}
.verdict.tight{border-left-color:var(--hot)}
details.honest{border:1px solid var(--line);border-left:3px solid var(--hot);border-radius:10px;background:var(--card);padding:10px 14px;font-size:13.5px}
details.honest summary{cursor:pointer;font-weight:600}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.legend i{width:22px;height:10px;display:inline-block;border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt=""><h1>Site Check</h1></div>
    <span class="spacer"></span>
    <button class="btn small" data-install hidden onclick="Factory.install()">Install app</button>
  </header>
  <main class="page" id="page"><div class="empty">Loading…</div></main>
</div>
<script src="data/latest.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/factory.js"></script>
<script src="app.js"></script>
</body>
</html>
