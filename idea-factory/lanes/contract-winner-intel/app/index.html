<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contract Winners</title>
<meta name="description" content="Who won recent federal contracts in Michigan, by agency, county and recipient">
<meta name="theme-color" content="#1f4e79">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="assets/factory.css">
<link rel="stylesheet" href="assets/leaflet.css">
<style>
:root{--acc:#1f4e79;--acc-fg:#fff;--hot:#d98324;--bg:#f1f3f6;--line:#d5dae1;--card:#fff;--card2:#e8ecf1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#7fb2e5;--acc-fg:#08131d;--hot:#f0a653;--bg:#0f1318;--line:#262e38;--card:#171d24;--card2:#1e2630}}
:root[data-theme="dark"]{--acc:#7fb2e5;--acc-fg:#08131d;--hot:#f0a653;--bg:#0f1318;--line:#262e38;--card:#171d24;--card2:#1e2630}
body{font-size:15px}
.page{gap:14px;padding-top:14px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi b{font-size:26px}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
#map{height:300px;border-radius:10px;border:1px solid var(--line)}
.leaflet-container{font:inherit;background:var(--card2)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.toolbar select,.toolbar input{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;min-width:0;flex:1 1 140px}
.aw{display:flex;flex-direction:column;gap:3px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);border-left:3px solid var(--acc)}
.aw.mod{border-left-color:var(--line)}
.aw .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.aw .who{font-weight:700}.aw .amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.aw .meta{font-size:12.5px;color:var(--mute)}.aw .d{font-size:13px}
.bars{display:flex;flex-direction:column;gap:7px}
.bars .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px}
.bars .r i{grid-column:1/3;display:block;height:6px;border-radius:3px;background:var(--acc)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--hot)}
details.honest{border:1px solid var(--line);border-left:3px solid var(--hot);border-radius:10px;background:var(--card);padding:10px 14px;font-size:13.5px}
details.honest summary{cursor:pointer;font-weight:600}
.legend{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.legend i{width:22px;height:10px;display:inline-block;border-radius:2px}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt=""><h1>Contract Winners</h1></div>
    <span class="spacer"></span>
    <button class="btn small" data-install hidden onclick="Factory.install()">Install app</button>
  </header>
  <main class="page" id="page"><div class="empty">Loading…</div></main>
</div>
<script src="data/latest.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/factory.js"></script>
<script src="app.js"></script>
</body>
</html>
